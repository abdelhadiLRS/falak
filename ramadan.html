<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="nav_ramadan">تحدي رمضان والبرامج الإيمانية — فلك</title>
  <meta name="description" content="تتبع الطاعات والختمة الرمضانية والبرامج الإيمانية اليومية في شهر رمضان المبارك" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-container">
    <div id="app-sidebar-container"></div>
    <div class="app-main">
      <div id="app-header-container"></div>

      <main class="page-content">
        <div class="page-header">
          <h1 class="page-title" data-i18n="nav_ramadan">تحدي رمضان المبارك</h1>
          <p class="page-subtitle">جدول متابعة عباداتك اليومية وختمة القرآن والتراويح والأذكار في الشهر الفضيل</p>
        </div>

        <div class="card" style="margin-bottom:2rem; text-align:center; padding:2rem; background:linear-gradient(135deg, var(--bg-card), var(--accent-light));">
          <h2 style="margin:0 0 0.5rem 0; color:var(--accent-color);">نسبة إنجاز طاعات اليوم</h2>
          <div id="ramadan-progress-percent" style="font-size:3rem; font-weight:900; color:var(--accent-gold); margin:0.5rem 0;">0%</div>
          <div style="width:100%; height:12px; background:var(--border-color); border-radius:10px; overflow:hidden;">
            <div id="ramadan-progress-bar" style="width:0%; height:100%; background:var(--accent-color); transition:width 0.4s ease;"></div>
          </div>
        </div>

        <h2 style="font-size:1.3rem; margin-bottom:1rem;">قائمة الطاعات والواجبات اليومية</h2>
        <div class="grid-cols-2" id="ramadan-tasks-container">
          جاري تحميل مهام البرامج الإيمانية...
        </div>
      </main>

      <div id="app-footer-container"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ramadan.js"></script>
</body>
</html>
